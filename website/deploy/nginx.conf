# Included inside the existing HTTPS server. /ws and /healthz stay unchanged.
root /var/www/purrimeter/current;
index index.html;

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

location /downloads/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ /\. {
    deny all;
}

# Release metadata is served by the relay, which also enforces admission.
location = /updates {
    proxy_pass http://127.0.0.1:18080/updates;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# Retained immutable packages keep in-progress downloads valid across publication.
location /game-releases/ {
    alias /var/www/purrimeter/game-releases/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
