<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#131c26"><title>Purrimeter — Play</title><link rel="stylesheet" href="browser.css"></head>
<body><main id="stage"><canvas id="canvas" tabindex="0" aria-label="Purrimeter game"></canvas></main>
<section id="gate" aria-live="polite"><img src="../assets/icon.png" alt="" width="72" height="72"><h1>Purrimeter</h1><noscript><p>Browser play needs JavaScript. Enable it, or choose a desktop download from the homepage.</p></noscript><p id="message">Your garden is getting ready.</p><progress id="progress"></progress><button id="continue" hidden>Continue without autosave</button><button id="takeover" hidden>Play in this tab</button><button id="retry" hidden>Try again</button><a href="/">Back to Purrimeter</a></section>
<aside id="save-warning" hidden><span>Autosave unavailable.</span><button id="backup">Export garden</button><button id="session">Continue without autosave</button></aside>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<script src="$GODOT_URL"></script><script>window.PURRIMETER_CONFIG = $GODOT_CONFIG;</script><script src="browser.js"></script></body></html>
